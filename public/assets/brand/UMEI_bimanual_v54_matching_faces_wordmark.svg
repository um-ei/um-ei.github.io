        <rect id="lower-bottom-contact-underlap" x="511.66666667" y="139" width="10" height="6" fill="#00628C" />
      </g>
      <g id="i-body" inkscape:groupmode="layer" inkscape:label="09 i — original 69-unit base width, 12-unit base height, shortened left serif" transform="translate(-0.33333333 0)">
        <path id="cardinal-i-body" d="M 522.33333333,44 H 575 V 130 H 583 L 597,138.4 V 142 H 528 V 130 H 541 V 57 H 530.33333333 L 522.33333333,49 Z" fill="#8C1515" />
      </g>
      <g id="i-dot" inkscape:groupmode="layer" inkscape:label="10 i — Cardinal red dot shifted left with upper gripper" transform="translate(-14.33333333 -6)">
        <circle id="cardinal-dot" cx="558" cy="20" r="18" fill="#8C1515" />
      </g>
      <g id="robot-joints" inkscape:groupmode="layer" inkscape:label="11 E — v5 hollow centers, shoulder and neck arc highlights">
        <g id="upper-shoulder">
          <circle id="upper-shoulder-outer-ring" cx="428" cy="19" r="19" fill="#00628C" />
          <circle id="upper-shoulder-white-center" cx="428" cy="19" r="7" fill="#FFFFFF" />
          <path id="upper-shoulder-arc-highlight" d="M 416.5438,17.9977 A 11.5,11.5 0 0 0 429.0023,30.4562" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" />
        </g>
        <g id="lower-shoulder">
          <circle id="lower-shoulder-outer-ring" cx="428" cy="131" r="19" fill="#00628C" />
          <circle id="lower-shoulder-white-center" cx="428" cy="131" r="7" fill="#FFFFFF" />
          <path id="lower-shoulder-arc-highlight" d="M 416.5438,129.9977 A 11.5,11.5 0 0 0 429.0023,142.4562" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" />
        </g>
        <g id="upper-wrist">
          <circle id="upper-wrist-outer-ring" cx="496" cy="14" r="14" fill="#00628C" />
          <circle id="upper-wrist-white-center" cx="496" cy="14" r="5" fill="#FFFFFF" />
        </g>
        <g id="lower-wrist">
          <circle id="lower-wrist-outer-ring" cx="496" cy="136" r="14" fill="#00628C" />
          <circle id="lower-wrist-white-center" cx="496" cy="136" r="5" fill="#FFFFFF" />
